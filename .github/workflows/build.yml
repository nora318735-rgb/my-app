name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract ZIP File
        run: unzip DhiqarTV2027_FINAL_READY.zip -d my_project

      - name: Force Clean and Inject Original UI
        run: |
          cd my_project
          rm -rf app/src/main/assets/index.html
          cat << 'EOF' > app/src/main/assets/index.html
          <!doctype html>
          <html lang="ar" dir="rtl">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
          <title>ذي قار TV 2027</title>
          <style>
              :root { --bg: #020712; --panel: #061121; --border: #12335e; --accent: #0077ff; --gold: #ffd23f; --text: #ffffff; --muted: #8ba2c2; }
              * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
              html, body { width: 100%; height: 100%; overflow: hidden; position: fixed; background: var(--bg); color: var(--text); }
              body::before { content: ""; position: fixed; inset: 0; background: radial-gradient(circle at 50% 10%, #08264e 0%, transparent 60%); z-index: -1; }

              /* شاشة تسجيل الدخول بالثلاث خانات المطلوبة */
              #login-screen { position: absolute; inset: 0; background: #020712; display: flex; align-items: center; justify-content: center; z-index: 99999; padding: 15px; }
              .login-card { background: rgba(6, 17, 33, 0.98); border: 1px solid var(--border); padding: 25px; border-radius: 16px; width: 100%; max-width: 380px; text-align: center; box-shadow: 0 15px 40px rgba(0,0,0,0.8); }
              .login-card img { width: 70px; height: 70px; border-radius: 14px; margin-bottom: 10px; }
              .login-card h2 { color: #fff; font-size: 20px; margin-bottom: 4px; }
              .login-card h2 span { color: var(--gold); }
              .login-card p { color: var(--muted); font-size: 11px; margin-bottom: 15px; }
              .input-box { margin-bottom: 10px; text-align: right; }
              .input-box label { display: block; font-size: 10px; color: var(--accent); margin-bottom: 3px; font-weight: bold; }
              .input-box input { width: 100%; padding: 10px; background: #020814; border: 1px solid var(--border); color: #fff; border-radius: 6px; font-size: 13px; outline: none; }
              .login-btn { width: 100%; padding: 12px; margin-top: 8px; background: linear-gradient(135deg, #0077ff, #0044bb); color: #fff; border: none; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; }
              #login-err { color: #ff4d4d; font-size: 11px; margin-top: 8px; display: none; }

              /* الواجهة الرئيسية */
              #app-ui { display: none; width: 100%; height: 100%; flex-direction: column; overflow: hidden; }
              header { height: 50px; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; background: var(--panel); border-bottom: 1px solid var(--border); flex-shrink: 0; }
              .logo-area { display: flex; align-items: center; gap: 8px; }
              .logo-area img { width: 32px; height: 32px; border-radius: 6px; object-fit: cover; }
              .logo-area h1 { font-size: 15px; margin: 0; }
              .logo-area h1 span { color: var(--gold); }
              .status-badge { background: rgba(0, 255, 136, 0.1); color: #00ff88; padding: 2px 8px; border-radius: 10px; font-size: 10px; border: 1px solid #00ff88; font-weight: bold; }

              .top-menu-bar { display: flex; gap: 6px; padding: 8px 12px; background: rgba(6, 17, 33, 0.7); border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; flex-shrink: 0; justify-content: center; }
              .top-menu-btn { display: flex; align-items: center; gap: 5px; padding: 6px 12px; background: #040e1c; border: 1px solid var(--border); border-radius: 8px; color: var(--muted); font-size: 12px; cursor: pointer; white-space: nowrap; }
              .top-menu-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: bold; box-shadow: 0 0 10px rgba(0,119,255,0.4); }

              .main-container { display: flex; flex: 1; height: calc(100% - 98px); overflow: hidden; padding: 8px; gap: 8px; }
              .channels-panel { width: 280px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden; }
              .search-box { padding: 8px; border-bottom: 1px solid var(--border); }
              .search-box input { width: 100%; padding: 8px; background: #020814; border: 1px solid var(--border); color: #fff; border-radius: 6px; outline: none; font-size: 11px; }
              .channels-list { flex: 1; overflow-y: auto; padding: 6px; scrollbar-width: none; }
              
              .channel-item { display: flex; align-items: center; padding: 8px; background: #040e1c; border: 1px solid var(--border); border-radius: 7px; margin-bottom: 5px; cursor: pointer; }
              .channel-item:active, .channel-item.focus { border-color: var(--accent); background: #0b1f3d; }
              .channel-item img { width: 38px; height: 26px; object-fit: contain; background: #000; border-radius: 4px; margin-left: 6px; flex-shrink: 0; }
              .channel-info { flex: 1; overflow: hidden; }
              .channel-info h4 { font-size: 11px; margin: 0; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
              .channel-info p { font-size: 9px; color: var(--muted); margin: 2px 0 0; }
              .live-badge { font-size: 8px; background: #ff2a2a; color: #fff; padding: 1px 4px; border-radius: 3px; font-weight: bold; flex-shrink: 0; }

              .player-panel { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
              .video-container { background: #000; border: 1px solid var(--border); border-radius: 10px; height: 60%; display: flex; justify-content: center; align-items: center; color: var(--muted); font-size: 12px; position: relative; overflow: hidden; }
              .info-container { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; flex: 1; padding: 10px; display: flex; flex-direction: column; justify-content: center; }
              .info-container h2 { font-size: 15px; color: #fff; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
              .info-container p { color: var(--muted); font-size: 11px; }

              @media (max-width: 800px) {
                  .main-container { flex-direction: column; padding: 5px; gap: 5px; }
                  .player-panel { height: 190px; flex: none; gap: 0; }
                  .info-container { display: none; }
                  .channels-panel { width: 100%; flex: 1; border-radius: 6px; }
              }
          </style>
          </head>
          <body>
          
          <!-- شاشة تسجيل الدخول بالبداية (3 خانات) -->
          <div id="login-screen">
              <div class="login-card">
                  <img src="splash_crop.png" onerror="this.src='ic_launcher.png'">
                  <h2>ذي قار TV <span>2027</span></h2>
                  <p>أدخل معلومات الاشتراك (Xtream Codes)</p>
                  
                  <div class="input-box"><label>🌐 رابط السيرفر (URL)</label><input type="text" id="xtream-url" value="http://vod4k.cc:80"></div>
                  <div class="input-box"><label>👤 اسم المستخدم (Username)</label><input type="text" id="xtream-user" value="3143771383105485"></div>
                  <div class="input-box"><label>🔑 كلمة المرور (Password)</label><input type="text" id="xtream-pass" value="5846751342"></div>
                  
                  <button class="login-btn" onclick="saveLogin()">تسجيل الدخول وبث القنوات</button>
                  <div id="login-err">يرجى التأكد من الحقول!</div>
              </div>
          </div>
          
          <!-- الواجهة الرئيسية -->
          <div id="app-ui">
              <header>
                  <div class="logo-area">
                      <img src="splash_crop.png" onerror="this.src='ic_launcher.png'">
                      <h1>ذي قار TV <span>2027</span></h1>
                  </div>
                  <div class="status-badge" id="app-status">نشط</div>
              </header>

              <div class="top-menu-bar">
                  <button class="top-menu-btn active" onclick="setCat('all')"><span>📺</span>القنوات المباشرة</button>
                  <button class="top-menu-btn" onclick="setCat('sport')"><span>⚽</span>مباريات اليوم</button>
                  <button class="top-menu-btn" onclick="setCat('movies')"><span>🎬</span>الأفلام</button>
                  <button class="top-menu-btn" onclick="setCat('series')"><span>📁</span>المسلسلات</button>
                  <button class="top-menu-btn" onclick="setCat('kids')"><span>🧸</span>الأطفال</button>
                  <button class="top-menu-btn" onclick="setCat('iraq')"><span>🇮🇶</span>العراقية</button>
                  <button class="top-menu-btn"><span>⚙️</span>الإعدادات</button>
              </div>

              <div class="main-container">
                  <div class="channels-panel">
                      <div class="search-box">
                          <input type="text" id="search" placeholder="ابحث عن قناة..." autocomplete="off">
                      </div>
                      <div class="channels-list" id="channels-container">
                          <div style="text-align:center; padding:15px; color:#8ba2c2; font-size:11px;">جاري تحميل القنوات...</div>
                      </div>
                  </div>
                  <div class="player-panel">
                      <div class="video-container" id="player-placeholder">اختر قناة من القائمة لبدء البث</div>
                      <div class="info-container">
                          <h2 id="now-playing-title">ذي قار TV 2027</h2>
                          <p id="now-playing-desc">جاهز للبث المباشر 4K PRO</p>
                      </div>
                  </div>
              </div>
          </div>
          
          <script>
          function saveLogin() {
              let u = document.getElementById('xtream-user').value.trim();
              let p = document.getElementById('xtream-pass').value.trim();
              if(u && p) {
                  document.getElementById('login-screen').style.display = 'none';
                  document.getElementById('app-ui').style.display = 'flex';
              } else {
                  document.getElementById('login-err').style.display = 'block';
              }
          }
          
          let allChannels = [], filteredChannels = [], currentCat = 'all';
          function setCat(cat) {
              currentCat = cat;
              document.querySelectorAll('.top-menu-btn').forEach(b => b.classList.remove('active'));
              event.currentTarget.classList.add('active');
              renderChannels();
          }
          
          function renderChannels() {
              let q = document.getElementById('search').value.trim().toLowerCase();
              filteredChannels = allChannels.filter(c => (currentCat === 'all' || c.category === currentCat) && (!q || (c.name || '').toLowerCase().includes(q)));
              let container = document.getElementById('channels-container');
              container.innerHTML = '';
              if(!filteredChannels.length){ container.innerHTML = '<div style="text-align:center; padding:15px; color:#8ba2c2; font-size:11px;">لا توجد قنوات مطابقة.</div>'; return; }
              
              filteredChannels.slice(0, 150).forEach((ch, index) => {
                  let item = document.createElement('div');
                  item.className = 'channel-item';
                  let sName = String(ch.name || '').replace(/[&<>"']/g,'');
                  let sLogo = String(ch.logo || '').replace(/[&<>"']/g,'');
                  item.innerHTML = '<img src="'+sLogo+'" onerror="this.style.opacity=\'0\'"><div class="channel-info"><h4>'+sName+'</h4><p>قناة '+ch.id+'</p></div><div class="live-badge">LIVE</div>';
                  
                  item.addEventListener('click', function(e) {
                      e.stopPropagation();
                      playCh(index);
                  }, {passive: true});
                  
                  container.appendChild(item);
              });
          }
          
          function playCh(index) {
              let ch = filteredChannels[index];
              if(!ch) return;
              document.getElementById('now-playing-title').textContent = ch.name;
              document.getElementById('now-playing-desc').textContent = 'بث مباشر عالي الجودة';
              document.getElementById('player-placeholder').textContent = 'جاري بث: ' + ch.name;
              if(window.AndroidPlayer) AndroidPlayer.play(ch.streamId);
          }
          
          window.setChannels = function(jsonStr) {
              try {
                  allChannels = JSON.parse(jsonStr) || [];
                  document.getElementById('app-status').textContent = 'نشط ('+allChannels.length+')';
                  renderChannels();
              } catch(e) {}
          };
          
          document.getElementById('search').addEventListener('input', () => { renderChannels(); });
          </script>
          </body>
          </html>
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        run: |
          cd my_project
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DhiqarTV_App
          path: my_project/app/build/outputs/apk/debug/*.apk
