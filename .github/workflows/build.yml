import 'package:flutter/material.dart';
import 'package:http/http.dart' as http;
import 'dart:convert';

void main() {
  runApp(const DhiqarTVApp());
}

class DhiqarTVApp extends StatelessWidget {
  const DhiqarTVApp({Key? key}) : super(key: key);

  @override
  Widget build(BuildContext context) {
    return MaterialApp(
      title: 'ذي قار TV 2027',
      debugShowCheckedModeBanner: false,
      theme: ThemeData.dark().copyWith(
        scaffoldBackgroundColor: const Color(0xFF070E17),
        primaryColor: const Color(0xFF00A3FF),
        cardColor: const Color(0xFF0F1C2E),
        colorScheme: const ColorScheme.dark(
          primary: Color(0xFF00A3FF),
          secondary: Color(0xFFFFD700),
        ),
      ),
      home: const LoginScreen(),
    );
  }
}

// -------------------------------------------------------------
// 1. شاشة تسجيل الدخول والربط بالسيرفر
// -------------------------------------------------------------
class LoginScreen extends StatefulWidget {
  const LoginScreen({Key? key}) : super(key: key);

  @override
  State<LoginScreen> createState() => _LoginScreenState();
}

class _LoginScreenState extends State<LoginScreen> {
  final TextEditingController _serverController = TextEditingController(text: 'http://vod4k.cc:80');
  final TextEditingController _userController = TextEditingController(text: '3143771383105485');
  final TextEditingController _passController = TextEditingController(text: '5846751342');
  bool _isLoading = false;

  Future<void> _loginAndFetchData() async {
    setState(() => _isLoading = true);

    final server = _serverController.text.trim();
    final user = _userController.text.trim();
    final pass = _passController.text.trim();

    final url = Uri.parse('$server/player_api.php?username=$user&password=$pass');

    try {
      final response = await http.get(url);
      if (response.statusCode == 200) {
        final data = json.decode(response.body);
        if (data['user_info'] != null && data['user_info']['auth'] == 1) {
          Navigator.pushReplacement(
            context,
            MaterialPageRoute(
              builder: (context) => HomeScreen(
                userInfo: data['user_info'],
                serverUrl: server,
                username: user,
                password: pass,
              ),
            ),
          );
        } else {
          _showError('بيانات الاشتراك غير صحيحة');
        }
      } else {
        _showError('فشل الاتصال بالسيرفر');
      }
    } catch (e) {
      _showError('حدث خطأ في الاتصال بالسيرفر');
    } finally {
      setState(() => _isLoading = false);
    }
  }

  void _showError(String message) {
    ScaffoldMessenger.of(context).showSnackBar(
      SnackBar(content: Text(message), backgroundColor: Colors.red),
    );
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      body: Container(
        decoration: const BoxDecoration(
          gradient: RadialGradient(
            colors: [Color(0xFF132A4A), Color(0xFF050A10)],
            radius: 1.2,
          ),
        ),
        child: Center(
          child: SingleChildScrollView(
            padding: const EdgeInsets.all(24.0),
            child: Column(
              mainAxisAlignment: MainAxisAlignment.center,
              children: [
                // شعار التطبيق
                Container(
                  padding: const EdgeInsets.all(16),
                  decoration: BoxDecoration(
                    shape: BoxShape.circle,
                    border: Border.all(color: const Color(0xFFFFD700), width: 2),
                    boxShadow: [
                      BoxShadow(color: const Color(0xFF00A3FF).withOpacity(0.4), blurRadius: 20),
                    ],
                  ),
                  child: const Icon(Icons.tv_rounded, size: 80, color: Color(0xFFFFD700)),
                ),
                const SizedBox(height: 16),
                const Text(
                  'ذي قار TV 2027',
                  style: TextStyle(fontSize: 28, fontWeight: FontWeight.bold, color: Colors.white),
                ),
                const Text('SAT-VIEW 4K PRO IPTV', style: TextStyle(color: Color(0xFF00A3FF))),
                const SizedBox(height: 32),

                // حقول الدخول
                _buildTextField(_serverController, 'رابط السيرفر', Icons.dns),
                const SizedBox(height: 12),
                _buildTextField(_userController, 'اسم المستخدم', Icons.person),
                const SizedBox(height: 12),
                _buildTextField(_passController, 'كلمة المرور', Icons.lock, obscureText: true),
                const SizedBox(height: 24),

                // زر الاتصال
                ElevatedButton(
                  onPressed: _isLoading ? null : _loginAndFetchData,
                  style: ElevatedButton.styleFrom(
                    backgroundColor: const Color(0xFF00A3FF),
                    minimumSize: const Size(double.infinity, 50),
                    shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(12)),
                  ),
                  child: _isLoading
                      ? const CircularProgressIndicator(color: Colors.white)
                      : const Text('دخول وتفعيل الاشتراك', style: TextStyle(fontSize: 18, color: Colors.white)),
                ),
              ],
            ),
          ),
        ),
      ),
    );
  }

  Widget _buildTextField(TextEditingController controller, String label, IconData icon, {bool obscureText = false}) {
    return TextField(
      controller: controller,
      obscureText: obscureText,
      decoration: InputDecoration(
        labelText: label,
        prefixIcon: Icon(icon, color: const Color(0xFF00A3FF)),
        filled: true,
        fillColor: const Color(0xFF0F1C2E),
        border: OutlineInputBorder(borderRadius: BorderRadius.circular(12), borderSide: BorderSide.none),
      ),
    );
  }
}

// -------------------------------------------------------------
// 2. الواجهة الرئيسية (Dashboard)
// -------------------------------------------------------------
class HomeScreen extends StatelessWidget {
  final Map<String, dynamic> userInfo;
  final String serverUrl;
  final String username;
  final String password;

  const HomeScreen({
    Key? key,
    required this.userInfo,
    required this.serverUrl,
    required this.username,
    required this.password,
  }) : super(key: key);

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(
        backgroundColor: const Color(0xFF0F1C2E),
        elevation: 0,
        title: Row(
          children: [
            const Icon(Icons.workspace_premium, color: Color(0xFFFFD700)),
            const SizedBox(width: 8),
            Text('ذي قار TV 2027', style: const TextStyle(color: Colors.white)),
          ],
        ),
        actions: [
          Padding(
            padding: const EdgeInsets.symmetric(horizontal: 16.0),
            child: Center(
              child: Text(
                'الاشتراك نشط حتى: ${userInfo['exp_date'] ?? '2027'}',
                style: const TextStyle(color: Colors.greenAccent, fontSize: 12),
              ),
            ),
          ),
        ],
      ),
      body: Padding(
        padding: const EdgeInsets.all(16.0),
        child: Column(
          children: [
            // الأقسام الرئيسية (شبكة الأيقونات)
            Expanded(
              child: GridView.count(
                crossAxisCount: 2,
                crossAxisSpacing: 16,
                mainAxisSpacing: 16,
                children: [
                  _buildCategoryCard(
                    context,
                    'القنوات المباشرة',
                    'LIVE TV',
                    Icons.live_tv,
                    const Color(0xFF00A3FF),
                    () => Navigator.push(
                      context,
                      MaterialPageRoute(
                        builder: (context) => ChannelListScreen(
                          serverUrl: serverUrl,
                          username: username,
                          password: password,
                        ),
                      ),
                    ),
                  ),
                  _buildCategoryCard(context, 'مباريات اليوم', 'SPORTS', Icons.sports_soccer, Colors.orange, () {}),
                  _buildCategoryCard(context, 'الأفلام', 'MOVIES', Icons.movie_creation, Colors.purpleAccent, () {}),
                  _buildCategoryCard(context, 'المسلسلات', 'SERIES', Icons.tv, Colors.redAccent, () {}),
                  _buildCategoryCard(context, 'المفضلة', 'FAVORITE', Icons.star, Colors.amber, () {}),
                  _buildCategoryCard(context, 'الإعدادات', 'SETTINGS', Icons.settings, Colors.blueGrey, () {}),
                ],
              ),
            ),
          ],
        ),
      ),
    );
  }

  Widget _buildCategoryCard(BuildContext context, String title, String subTitle, IconData icon, Color accentColor, VoidCallback onTap) {
    return InkWell(
      onTap: onTap,
      borderRadius: BorderRadius.circular(16),
      child: Container(
        decoration: BoxDecoration(
          color: const Color(0xFF0F1C2E),
          borderRadius: BorderRadius.circular(16),
          border: Border.all(color: accentColor.withOpacity(0.5), width: 1.5),
          boxShadow: [
            BoxShadow(color: accentColor.withOpacity(0.15), blurRadius: 10, spreadRadius: 1),
          ],
        ),
        child: Column(
          mainAxisAlignment: MainAxisAlignment.center,
          children: [
            Icon(icon, size: 48, color: accentColor),
            const SizedBox(height: 8),
            Text(title, style: const TextStyle(fontSize: 16, fontWeight: FontWeight.bold, color: Colors.white)),
            Text(subTitle, style: TextStyle(fontSize: 11, color: accentColor)),
          ],
        ),
      ),
    );
  }
}

// -------------------------------------------------------------
// 3. شاشة عرض القنوات والبث المباشر
// -------------------------------------------------------------
class ChannelListScreen extends StatefulWidget {
  final String serverUrl;
  final String username;
  final String password;

  const ChannelListScreen({
    Key? key,
    required this.serverUrl,
    required this.username,
    required this.password,
  }) : super(key: key);

  @override
  State<ChannelListScreen> createState() => _ChannelListScreenState();
}

class _ChannelListScreenState extends State<ChannelListScreen> {
  List<dynamic> _channels = [];
  bool _loading = true;

  @override
  void initState() {
    super.initState();
    _fetchChannels();
  }

  Future<void> _fetchChannels() async {
    final url = Uri.parse('${widget.serverUrl}/player_api.php?username=${widget.username}&password=${widget.password}&action=get_live_streams');
    try {
      final response = await http.get(url);
      if (response.statusCode == 200) {
        setState(() {
          _channels = json.decode(response.body);
          _loading = false;
        });
      }
    } catch (e) {
      setState(() => _loading = false);
    }
  }

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(
        title: const Text('قائمة القنوات المباشرة'),
        backgroundColor: const Color(0xFF0F1C2E),
      ),
      body: _loading
          ? const Center(child: CircularProgressIndicator())
          : ListView.builder(
              itemCount: _channels.length,
              itemBuilder: (context, index) {
                final channel = _channels[index];
                return Card(
                  color: const Color(0xFF0F1C2E),
                  margin: const EdgeInsets.symmetric(horizontal: 12, vertical: 4),
                  child: ListTile(
                    leading: channel['stream_icon'] != null && channel['stream_icon'].toString().isNotEmpty
                        ? Image.network(channel['stream_icon'], width: 40, errorBuilder: (c, e, s) => const Icon(Icons.tv))
                        : const Icon(Icons.tv, color: Color(0xFF00A3FF)),
                    title: Text(channel['name'] ?? 'قناة بدون اسم', style: const TextStyle(color: Colors.white)),
                    trailing: const Icon(Icons.play_circle_fill, color: Colors.greenAccent),
                    onTap: () {
                      final streamUrl = '${widget.serverUrl}/live/${widget.username}/${widget.password}/${channel['stream_id']}.m3u8';
                      ScaffoldMessenger.of(context).showSnackBar(
                        SnackBar(content: Text('جاري تشغيل: ${channel['name']}\n الرابط: $streamUrl')),
                      );
                    },
                  ),
                );
              },
            ),
    );
  }
}
