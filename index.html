<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ذي قار TV 2027</title>
<style>
:root{--bg:#020711;--panel:#071326;--line:#12345a;--blue:#18a9ff;--cyan:#5de1ff;--gold:#ffd23f;--muted:#91a4ba}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#fff;font-family:Arial,"Noto Sans Arabic",sans-serif}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 70% 15%,#073b70aa,transparent 38%),linear-gradient(135deg,#020711,#03182e 55%,#020711);pointer-events:none}
.app{position:relative;height:100%;padding:12px;display:flex;flex-direction:column;gap:10px}.top{height:65px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border:1px solid #12375b;border-radius:12px;background:#061222ee;box-shadow:0 0 25px #008cff18}.brand{display:flex;align-items:center;gap:10px}.brand img{width:45px;height:45px;border-radius:10px;object-fit:cover;box-shadow:0 0 18px #00aaff66}.brand b{font-size:21px}.brand small{display:block;color:var(--cyan);font-size:10px;margin-top:3px}.clock{text-align:center}.clock b{font-size:18px}.clock span{font-size:11px;color:#9eb0c5}.status{color:#39ef9a;font-size:12px}.main{min-height:0;flex:1;display:flex;gap:12px}.channels{width:43%;min-width:330px;border:1px solid var(--line);border-radius:12px;background:#061120e8;padding:12px;display:flex;flex-direction:column;min-height:0}.title{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.title h2{margin:0;font-size:19px}.count{font-size:11px;color:var(--cyan)}.search{display:flex;align-items:center;gap:7px;background:#020913;border:1px solid #17446d;border-radius:9px;padding:9px;margin-bottom:8px}.search input{width:100%;border:0;outline:0;background:transparent;color:#fff;font-size:14px}.tabs{display:flex;gap:5px;overflow:auto;padding-bottom:7px}.tab{padding:6px 10px;white-space:nowrap;border-radius:7px;background:#091b30;color:#a8b7c8;font-size:12px;cursor:pointer}.tab.active{background:linear-gradient(135deg,#11a9ff,#0966d7);color:#fff;box-shadow:0 0 12px #0da8ff55}.list{overflow:auto;min-height:0}.item{display:flex;align-items:center;gap:8px;padding:9px 7px;margin-bottom:5px;border:1px solid transparent;border-radius:9px;background:#06182a;cursor:pointer;transition:.18s}.item:hover,.item.focus{border-color:#12aaff;background:#0b2944;box-shadow:0 0 16px #0aaaff22}.item img{width:48px;height:31px;object-fit:contain;background:#000;border-radius:5px}.num{width:30px;color:#7f96ad;font-size:11px}.name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;font-size:13px}.meta{font-size:10px;color:#35e69a}.right{width:57%;min-width:0;display:flex;flex-direction:column;gap:10px}.playerSpace{height:330px;border-radius:12px;border:1px solid #1b456d;background:linear-gradient(135deg,#02060d,#06182b);display:flex;align-items:center;justify-content:center;color:#6f879e}.playerSpace b{font-size:18px}.info{flex:1;min-height:110px;border:1px solid var(--line);border-radius:12px;background:#061120e8;padding:14px}.info h1{margin:0 0 6px;color:#fff;font-size:20px}.info p{margin:0;color:#9eb0c5}.bar{height:5px;background:#16304a;border-radius:9px;margin:11px 0}.bar i{display:block;width:65%;height:100%;background:linear-gradient(90deg,#0c91ff,#53ddff);border-radius:9px}.badges{display:flex;gap:7px}.badge{border:1px solid #285172;border-radius:6px;padding:4px 8px;font-size:10px;color:#a9c0d6}.bottom{height:38px;display:flex;justify-content:center;gap:35px;align-items:center;border:1px solid #12375b;border-radius:10px;background:#061222;color:#9eb0c5;font-size:11px}.empty,.error{text-align:center;color:#8ba0b4;padding:35px}.error{color:#ff7373}
@media(max-width:850px){.main{flex-direction:column;overflow:auto}.channels,.right{width:100%}.channels{height:52vh}.right{height:45vh}.top .clock{display:none}.playerSpace{height:220px}}
</style></head>
<body>
<div class="app">
<header class="top">
<div class="brand"><img src="splash_crop.png"><div><b>ذي قار TV <span style="color:#ffd23f">2027</span></b><small>SMART IPTV • 4K PRO</small></div></div>
<div class="clock"><span id="date"></span><br><b id="time"></b></div>
<div class="status">● اشتراك نشط <span id="state">جاري الاتصال...</span></div>
</header>
<main class="main">
<section class="channels"><div class="title"><h2>قائمة القنوات</h2><span class="count" id="count">0 قناة</span></div>
<div class="search">⌕<input id="search" placeholder="ابحث عن قناة..." autocomplete="off"></div>
<div class="tabs"><div class="tab active" data-cat="all">الكل</div><div class="tab" data-cat="iraq">العراقية</div><div class="tab" data-cat="sport">رياضة</div><div class="tab" data-cat="movies">أفلام</div><div class="tab" data-cat="news">أخبار</div><div class="tab" data-cat="kids">أطفال</div></div>
<div class="list" id="list"><div class="empty">جاري تحميل القنوات الحقيقية...</div></div></section>
<section class="right"><div class="playerSpace"><b>اختر قناة من القائمة لبدء التشغيل</b></div><div class="info"><h1 id="title">ذي قار TV 2027</h1><p id="desc">جاهز للبث المباشر</p><div class="bar"><i></i></div><div class="badges"><span class="badge">LIVE</span><span class="badge">MEDIA3</span><span class="badge">4K</span><span class="badge">EPG</span></div></div></section>
</main><footer class="bottom"><span>⌂ الرئيسية</span><span>▣ القنوات</span><span>★ المفضلة</span><span>⚙ الإعدادات</span></footer></div>
<script>
let all=[],filtered=[],idx=0,cat='all';const $=x=>document.getElementById(x);
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function render(){let q=$('search').value.trim().toLowerCase();filtered=all.filter(c=>(cat==='all'||c.category===cat)&&(!q||(c.name||'').toLowerCase().includes(q)));idx=Math.min(idx,Math.max(0,filtered.length-1));$('count').textContent=all.length+' قناة';$('list').innerHTML='';if(!filtered.length){$('list').innerHTML='<div class="empty">لا توجد قنوات.</div>';return}filtered.forEach((c,i)=>{let e=document.createElement('div');e.className='item'+(i===idx?' focus':'');e.innerHTML='<img src="'+esc(c.logo)+'" onerror="this.style.visibility=\'hidden\'"><span class="num">'+String(c.id).padStart(3,'0')+'</span><span class="name">'+esc(c.name)+'</span><span class="meta">مباشر</span>';e.onclick=()=>select(i);$('list').appendChild(e)})}
function focus(){[...$('list').children].forEach((e,i)=>e.classList.toggle('focus',i===idx));let e=$('list').children[idx];if(e)e.scrollIntoView({block:'nearest'})}
function select(i){let c=filtered[i];if(!c)return;idx=i;focus();$('title').textContent=c.name;$('desc').textContent='بث مباشر • '+c.name;$('state').textContent=' • '+c.name;if(window.AndroidPlayer)AndroidPlayer.play(c.streamId)}
window.setChannels=function(json){try{all=JSON.parse(json)||[];$('state').textContent=' • '+all.length+' قناة';render()}catch(e){showServerError('بيانات غير صالحة')}};
window.showServerError=function(msg){$('state').textContent=' • خطأ';$('list').innerHTML='<div class="error">تعذر تحميل القنوات<br><br>'+esc(msg)+'</div>'};window.playerError=function(msg){$('desc').textContent='تعذر تشغيل القناة: '+(msg||'خطأ')};
$('search').oninput=()=>{idx=0;render()};document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');cat=t.dataset.cat;idx=0;render()});
document.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){e.preventDefault();if(idx<filtered.length-1){idx++;focus()}}if(e.key==='ArrowUp'){e.preventDefault();if(idx>0){idx--;focus()}}if(e.key==='Enter'){e.preventDefault();select(idx)}});
function clock(){let n=new Date();$('date').textContent=n.toLocaleDateString('ar-IQ',{weekday:'long',day:'numeric',month:'long'});$('time').textContent=n.toLocaleTimeString('ar-IQ',{hour:'2-digit',minute:'2-digit'})}clock();setInterval(clock,1000);
</script></body></html>
